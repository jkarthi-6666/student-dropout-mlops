# Every value here is logged to MLflow with each run.
# Nothing tunable should be hardcoded in a script.

project:
  name: dropout-risk
  seed: 42

data:
  uci_dataset_id: 697
  raw_path: data/raw/dropout.csv
  checksum_path: data/raw/dropout.csv.sha256
  # Second-semester columns postdate the decision point -> leakage.
  drop_column_prefix: "Curricular units 2nd sem"

target:
  source_column: "Target"
  # Original classes: Dropout / Enrolled / Graduate
  # Binary mapping: Dropout -> 1, everything else -> 0
  positive_class: "Dropout"
  name: "dropout"
  expected_base_rate: 0.321
  base_rate_tolerance: 0.05

split:
  test_size: 0.20
  cv_folds: 5
  stratify: true

metric:
  # Capacity of the intensive support programme, as a share of the cohort.
  k_percent: 0.10
  bootstrap_iterations: 2000
  ci_level: 0.95
  primary: "precision_at_k"

features:
  # Ablation switch: run once true, once false, compare in MLflow.
  use_engineered: true
  top_k_categories: 10
  other_bucket: "OTHER"
  high_cardinality_columns:
    - "Mother's qualification"
    - "Father's qualification"
    - "Mother's occupation"
    - "Father's occupation"
    - "Nacionality"
    - "Application mode"
    - "Previous qualification"
  low_cardinality_columns:
    - "Marital status"
    - "Course"

model:
  # null or "balanced" -- expected to be a null result for a ranking metric.
  class_weight: null
  hist_gradient_boosting:
    learning_rate: 0.1
    max_leaf_nodes: 31
    min_samples_leaf: 20
    l2_regularization: 0.0
    max_iter: 300
    early_stopping: true
  logistic_regression:
    C: 1.0
    max_iter: 2000
  search:
    enabled: true
    n_iter: 50

gate:
  # A model is promoted only if it beats the pass-rate baseline AND the
  # bootstrap CI of the difference excludes zero.
  require_ci_excludes_zero: true
  # No slice may fall more than this far below the global precision@k.
  slice_tolerance: 0.20

registry:
  model_name: "dropout-risk-ranker"
  champion_alias: "champion"

slices:
  - "Gender"
  - "Age at enrollment"
  - "International"
  - "Displaced"
  - "Scholarship holder"
  - "Debtor"

drift:
  psi_threshold: 0.25
  flagged_count_tolerance: 0.30
