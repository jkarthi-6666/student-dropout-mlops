[project]
name = "dropout-risk"
version = "0.1.0"
description = "Ranking students by dropout risk to allocate a capacity-constrained support programme"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # zenml[server] pulls in the SQL-store + auth deps (alembic, sqlmodel,
    # passlib, pyjwt, ...) that the bare zenml package leaves undeclared.
    "zenml[server]==0.96.2",
    "mlflow==3.14.0",
    "scikit-learn==1.9.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "pandera[pandas]>=0.20",
    "evidently==0.7.21",
    "shap>=0.46",
    "ucimlrepo>=0.0.7",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    # Floors on SHAP's transitive deps: without these the resolver reaches
    # back to llvmlite 0.36 / numba pre-0.59, neither of which builds on
    # Python 3.12. These versions ship prebuilt 3.12 wheels.
    "llvmlite>=0.43",
    "numba>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dropout_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
